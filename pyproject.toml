[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-claim-audit"
version = "0.1.0"
description = "Offline documentation and Python body-pose evidence auditor"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
pose-claim-audit = "pose_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["pose_claim_audit*"]
